version: "3.9"

services:
  postgres:
    image: postgres:16

    container_name: pos_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: kimthuy
      POSTGRES_PASSWORD: kimthuy1997
      POSTGRES_DB: rental_room

    ports:
      - "5432:5432"

    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data