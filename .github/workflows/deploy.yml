name: Deploy Next.js Application

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Create .env file
        run: |
          echo "DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres-container:5432/${{ secrets.POSTGRES_DB }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "AUTH_URL=${{ secrets.AUTH_URL }}" >> .env
          echo "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> .env
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> .env
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
          echo "AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}" >> .env
          echo "NODE_ENV=production" >> .env

      - name: Build Docker Image
        run: |
          docker build -t integrationninjas/nextjs-app:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build Docker Image
        run: |
          docker build -t kimthuy/nextjs-app:latest.

      - name: Push Docker Image
        run: |
          docker push kimthuy/nextjs-app:latest
  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Create Docker Network
        run: |
          docker network create app-network || true

      - name: Start PostgreSQL Container
        run: |
          docker rm -f postgres-container || true

          docker run -d \
            --name postgres-container \
            --network app-network \
            -e POSTGRES_USER=${{ secrets.POSTGRES_USER }} \
            -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
            -e POSTGRES_DB=${{ secrets.POSTGRES_DB }} \
            -v postgres-data:/var/lib/postgresql/data \
            -p 5432:5432 \
            postgres:16-alpine

      - name: Wait For PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."

          for i in {1..30}; do
            docker exec postgres-container pg_isready -U ${{ secrets.POSTGRES_USER }} && break

            echo "Attempt $i failed. Retrying in 5 seconds..."
            sleep 5
          done

      - name: Pull Latest Docker Image
        run: |
          docker pull integrationninjas/nextjs-app:latest

      - name: Remove Old Application Container
        run: |
          docker rm -f nextjs-app-container || true

      - name: Run Next.js Container
        run: |
          docker run -d \
            --name nextjs-app-container \
            --network app-network \
            -p 5000:3000 \
            -e DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres-container:5432/${{ secrets.POSTGRES_DB }} \
            -e PORT=3000 \
            -e AUTH_SECRET=${{ secrets.AUTH_SECRET }} \
            -e AUTH_URL=${{ secrets.AUTH_URL }} \
            -e BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }} \
            -e AWS_REGION=${{ secrets.AWS_REGION }} \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }} \
            -e NODE_ENV=production \
            integrationninjas/nextjs-app:latest

      - name: Verify Container
        run: |
          docker ps

      - name: Show Logs
        run: |
          sleep 15
          docker logs nextjs-app-container