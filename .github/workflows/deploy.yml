name: Deploy Next.js application
on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # Next.js requires these variables during compilation (Build-Time)
      - name: Create .env file
        run: |
          echo "DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres-container:5432/${{ secrets.POSTGRES_DB }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "AUTH_URL=${{ secrets.AUTH_URL }}" >> .env
          echo "NODE_ENV=production" >> .env

      - name: Build docker image
        run: docker build -t integrationninjas/nextjs-app:latest .

      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish image to docker hub
        run: docker push integrationninjas/nextjs-app:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Create Docker network
        run: docker network create app-network || true

      - name: Start PostgreSQL container
        run: |
          docker rm -f postgres-container || true
          docker run -d \
            --name postgres-container \
            --network app-network \
            -e POSTGRES_USER=${{ secrets.POSTGRES_USER }} \
            -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
            -e POSTGRES_DB=${{ secrets.POSTGRES_DB }} \
            -v postgres-data:/var/lib/postgresql/data \
            -p 5432:5432 \
            postgres:16-alpine

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..15}; do
            docker exec postgres-container pg_isready -U ${{ secrets.POSTGRES_USER }} && break
            echo "Attempt $i failed, retrying in 3s..."
            sleep 3
          done

      - name: Pull image from docker hub
        run: docker pull integrationninjas/nextjs-app:latest

      - name: Delete old container
        run: docker rm -f nextjs-app-container || true

      # Injecting all AWS, Server, and Auth configurations directly into the container instance (Runtime)
      - name: Run docker container
        run: |
          docker run -d -p 5000:5000 \
            --name nextjs-app-container \
            --network app-network \
            -e DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres-container:5432/${{ secrets.POSTGRES_DB }} \
            -e PORT=${{ secrets.PORT }} \
            -e AUTH_SECRET=${{ secrets.AUTH_SECRET }} \
            -e AUTH_URL=${{ secrets.AUTH_URL }} \
            -e BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }} \
            -e AWS_REGION=${{ secrets.AWS_REGION }} \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }} \
            -e NODE_ENV=production \
            integrationninjas/nextjs-app:latest